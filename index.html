<style>

const POKE={pp:['早上好呀！','今天的烟圈圆不圆？','我会小声一点的。'],bd:['早上好！','啾？','我的窝快搭好啦。']};
function poke(e){if(playing||T||!cur)return;rayAt(e);
  const hits=ray.intersectObjects([signF,signB,...POPS.filter(a=>a.on&&a.g.visible&&!a.fx).map(a=>a.mesh)],false);if(!hits.length)return;
  const o=hits[0].object;
  if(o.userData.sign){SIGN.face=SIGN.spin>PI/2?0:1;signTo(SIGN.face,600,false);signSwing(.12,1);return}
  const a=o.userData.actor;if(!a||BUBS.some(b=>b.a===a))return;
  if(a===pupu){S.puff();smokeUp(smoke.ring,{d:2400,rise:.22,from:.35,to:.7});const l=POKE.pp[Math.floor(Math.random()*3)];bubble(pupu,l,'',1800);hush();speak(l,'pp');jump(pupu,.02,300,false);return}
  if(a===bird){S.chirp();const l=POKE.bd[Math.floor(Math.random()*3)];bubble(bird,l,'',1600);hush();speak(l,'bd');jump(bird,.03,300,false);return}
  if(flowers.includes(a)){S.bop(flowers.indexOf(a));jump(a,.05,360,false);return}
  if(a===fly){jump(a,.05,500,false);return}
  S.rustle();jump(a,.015,260,false)}

/* ---------- buttons ---------- */
$('bNext').onclick=()=>{ac();go(cur+1)};$('bPrev').onclick=()=>{ac();go(cur-1)};
$('bPlay').onclick=()=>{ac();if(playing){stop();camT.x=0;camT.z=CZ;camT.zoom=1}else play()};
$('bReset').onclick=()=>{camT.x=cur?0:.5;camT.z=CZ;camT.zoom=cur?1:.82;PTR.x=PTR.y=0;USER.az=Math.round(USER.az/360)*360;USER.el=54;USER.zoom=1};
$('bRotL').onclick=()=>{USER.az+=45};$('bRotR').onclick=()=>{USER.az-=45};
$('bSnd').onclick=e=>{SND=!SND;e.currentTarget.textContent='声音：'+(SND?'开':'关');e.currentTarget.setAttribute('aria-pressed',SND);if(!SND)hush()};
const SHOTS=['','镜 01–02','镜 03–05','镜 06–07','镜 08–10','镜 11–12'];
$('tocList').innerHTML=SP.map((s,i)=>`<li><button data-i="${i}"><span>${i?String(i).padStart(2,'0'):'封面'}</span>${s.t}<em>${SHOTS[i]}</em></button></li>`).join('');
$('tocList').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('toc').classList.remove('on');go(+b.dataset.i)};
$('bToc').onclick=()=>$('toc').classList.add('on');$('bTocX').onclick=()=>$('toc').classList.remove('on');$('toc').onclick=e=>{if(e.target.id==='toc')$('toc').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='q'||e.key==='Q')USER.az+=15;if(e.key==='e'||e.key==='E')USER.az-=15;if(e.key==='ArrowUp')USER.el=clamp(USER.el+5,18,84);if(e.key==='ArrowDown')USER.el=clamp(USER.el-5,18,84);
  if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '){e.preventDefault();$('bPlay').click()}});

/* ---------- loop ---------- */
let last=performance.now();const V=new THREE.Vector3();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;now=ts;
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];if(w.tok!==null&&w.tok!==RUN){TW.splice(i,1);w.res();continue}const t=clamp((now-w.t0)/w.d);w.fn(w.ease(t));if(t>=1){TW.splice(i,1);w.res()}}
  const pr=T?(T.dir>0?T.p:1-T.p):0,G=T?clamp(1-pr/.3):1,t=ts/1000,yaw=camC.az*PI/180;
  book.updateMatrixWorld(true);
  if(bird.att){const p=bird.att();bird.at(p.x,p.z);bird.lift=p.y}
  signG.rotation.y=SIGN.spin;signG.rotation.z=SIGN.swing+Math.sin(t*1.4)*.015;signRoot.visible=cur>0&&tree.g.visible;
  for(const a of POPS)a.update(t,G,yaw);
  if(straw.att==='beak'){book.updateMatrixWorld(true);const p=beakWorld();straw.dir=bird.dir;straw.at(p.x,p.z+.004);straw.lift=p.y-.004;straw.roll=0}
  if(fly.on){const np=Math.floor(t*7)%2?'c':'o';if(fly.pose!==np)fly.setPose(np);fly.body.position.x+=Math.sin(t*.7)*.06}
  placeCam(dt);R.render(scene,cam);
  for(let i=BUBS.length-1;i>=0;i--){const b=BUBS[i];if(now>b.until||!b.a||!b.a.g.visible){b.el.remove();BUBS.splice(i,1);continue}
    V.copy(b.a.top()).project(cam);b.el.style.left=clamp((V.x+1)/2*innerWidth,90,innerWidth-90)+'px';b.el.style.top=clamp((1-V.y)/2*innerHeight,80,innerHeight)+'px'}
  requestAnimationFrame(frame)}

/* ---------- boot ---------- */
(async()=>{
  try{await loadAll()}catch(e){$('lp').textContent='图片加载失败，请刷新重试';return}
  const tt=TX.walnut_table;tt.wrapS=tt.wrapT=THREE.MirroredRepeatWrapping;tt.repeat.set(3,5);
  table=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshStandardMaterial({map:tt,roughness:.85}));table.rotation.x=-PI/2;table.position.y=-.049;table.receiveShadow=true;scene.add(table);
  buildActors();buildPages();resize();Object.assign(LS,snap('morning'));applyLS();setup(0);setStatic();ui();
  requestAnimationFrame(frame);setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),700)},300);
  const h=location.hash.match(/^#p(\d)$/);if(h)setTimeout(()=>go(+h[1]),900);
})();
}
